<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>個人賽程與成績登錄</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 14px; background-color: #f4f6f8; color: #333; margin: 0; }
    .card { background: white; border-radius: 12px; padding: 16px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); margin-bottom: 14px; }
    h2, h3 { margin-top: 0; color: #1a1a1a; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .btn-group-sm { display: flex; gap: 6px; }
    .rebind-btn { background: #eee; border: none; padding: 6px 10px; border-radius: 6px; font-size: 12px; color: #555; cursor: pointer; font-weight: bold; }
    .close-top-btn { background: #333; border: none; padding: 6px 10px; border-radius: 6px; font-size: 12px; color: #fff; cursor: pointer; font-weight: bold; }
    input[type="text"], input[type="password"] { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 15px; }
    .btn { width: 100%; padding: 12px; background: #06C755; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 12px; }
    .btn:disabled { background: #bbb; }
    .btn-dark { background: #374151; margin-top: 8px; }

    .match-item { border: 1px solid #e5e7eb; border-radius: 10px; padding: 14px; margin-bottom: 12px; background: #fff; transition: all 0.25s ease; }
    .match-item.pending { border-left: 5px solid #ff9800; cursor: pointer; }
    .match-item.done { border-left: 5px solid #06C755; background: #fafafa; }
    .badge { display: inline-block; padding: 3px 8px; border-radius: 12px; font-size: 12px; font-weight: bold; }
    .badge-yes { background: #e8f5e9; color: #2e7d32; }
    .badge-no { background: #fff3e0; color: #ef6c00; }
    .vs-title { font-size: 16px; font-weight: bold; margin: 8px 0; color: #111; }
    .sub-info { font-size: 13px; color: #666; }

    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.55); z-index: 99; align-items: center; justify-content: center; }
    .modal-box { background: white; width: 92%; max-width: 420px; border-radius: 14px; padding: 18px; box-sizing: border-box; max-height: 90vh; overflow-y: auto; }
    .section-label { font-size: 13px; font-weight: bold; color: #555; margin: 12px 0 6px 0; display: block; }

    .check-group { display: flex; gap: 8px; flex-wrap: wrap; }
    .check-option { flex: 1; min-width: 45%; position: relative; }
    .check-option input[type="radio"] { position: absolute; opacity: 0; cursor: pointer; }
    .check-card { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 8px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 14px; font-weight: bold; color: #444; background: #fff; cursor: pointer; text-align: center; transition: all 0.15s; }
    .check-option input[type="radio"]:checked + .check-card { border-color: #06C755; background: #e8f8ee; color: #06C755; }
    .check-icon { font-size: 16px; }

    .set-box { background: #f8f9fa; border-radius: 10px; padding: 10px; margin-bottom: 8px; border: 1px solid #eee; }
    .set-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 13px; font-weight: bold; }
    .preset-chips { display: flex; gap: 4px; }
    .chip { background: #e9ecef; border: none; border-radius: 6px; padding: 3px 7px; font-size: 11px; color: #333; cursor: pointer; }
    .chip:active { background: #06C755; color: white; }
    .stepper-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .stepper { display: flex; align-items: center; background: white; border: 1px solid #ddd; border-radius: 8px; overflow: hidden; flex: 1; }
    .stepper button { width: 34px; height: 34px; border: none; background: #f1f3f5; font-size: 18px; font-weight: bold; cursor: pointer; }
    .stepper span { flex: 1; text-align: center; font-size: 16px; font-weight: bold; }
    .btn-cancel { background: #999; margin-top: 8px; }
    .err-msg { color: #d32f2f; font-size: 12px; margin-top: 8px; display: none; }
    .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
    .sel { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; background: #fff; box-sizing: border-box; }
    .stu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .stu { padding: 9px 8px; border: 2px solid #e0e0e0; border-radius: 8px; background: #fff; font-size: 13px; cursor: pointer; text-align: left; color: #444; }
    .stu.on { border-color: #06C755; background: #e8f8ee; color: #06C755; font-weight: bold; }
    .tab-btn { flex: 1 1 28%; padding: 8px 4px; border: 1px solid #ddd; background: #fff; border-radius: 8px; font-size: 13px; font-weight: bold; cursor: pointer; color: #444; }
    .tab-btn.active { background: #06C755; color: #fff; border-color: #06C755; }
  </style>
</head>
<body>

  <div id="loadingBox" class="card" style="text-align:center; padding:30px;">
    <div id="loadingText">讀取個人資料與賽程中...</div>
  </div>

  <!-- 1. 學號綁定區塊 -->
  <div id="bindBox" class="card" style="display:none;">
    <h2>🔗 綁定學生學號</h2>
    <p style="font-size:14px; color:#666;">尚未綁定學號，請輸入您的學號以載入個人賽程：</p>
    <input type="text" id="inputStudentId" placeholder="請輸入學號（例：14114157）">
    <button class="btn" id="bindBtn" onclick="doBind()">確認綁定學號</button>
    <button class="btn btn-dark" onclick="closeLiffWindow()">關閉視窗回到 LINE BOT</button>
    <div style="margin-top:14px; border-top:1px solid #eee; padding-top:12px;">
      <a href="#" onclick="toggleTeacherBind(event)" style="font-size:13px; color:#06C755; font-weight:bold;">👩‍🏫 我是老師（教師綁定）</a>
      <div id="teacherBindBox" style="display:none;">
        <input type="text" id="inputTeacherName" placeholder="老師姓名" style="margin-top:8px;">
        <input type="password" id="inputTeacherCode" placeholder="教師驗證碼" style="margin-top:8px; width:100%; padding:10px; border:1px solid #ddd; border-radius:8px; box-sizing:border-box; font-size:15px;">
        <button class="btn" id="teacherBindBtn" onclick="doBindTeacher()">綁定為老師</button>
      </div>
    </div>
    <div id="bindErr" class="err-msg"></div>
  </div>

  <!-- 2. 個人賽程總覽區塊 -->
  <div id="dashboardBox" style="display:none;">
    <div class="card">
      <div class="header-bar">
        <div>
          <h3 id="studentTitle" style="margin-bottom:4px;">選手賽程</h3>
          <div id="studentSub" class="sub-info"></div>
        </div>
        <div class="btn-group-sm">
          <button class="rebind-btn" onclick="showRebind()">切換學號</button>
          <button class="rebind-btn" onclick="doUnbind()">解除綁定</button>
          <button class="close-top-btn" onclick="closeLiffWindow()">✕ 關閉</button>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="header-bar" style="margin-bottom:12px;">
        <h3 style="margin:0;">📋 我的所有賽程</h3>
        <button class="rebind-btn" onclick="loadDashboard(false)">↻ 重新整理</button>
      </div>
      <div id="matchList"></div>
      <button class="btn btn-dark" onclick="closeLiffWindow()">🔙 關閉視窗回到 LINE BOT</button>
    </div>
  </div>

  <!-- 老師管理區塊 -->
  <div id="teacherBox" style="display:none;">
    <div class="card">
      <div class="header-bar">
        <div>
          <h3 id="teacherTitle" style="margin-bottom:4px;">老師</h3>
          <div class="sub-info">可新增、修改、刪除賽程與名單資料</div>
        </div>
        <div class="btn-group-sm">
          <button class="rebind-btn" onclick="doUnbind()">解除綁定</button>
          <button class="close-top-btn" onclick="closeLiffWindow()">✕ 關閉</button>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="tabs" id="mainTabs">
        <button class="tab-btn" data-s="單打紀錄" onclick="setTeacherSheet('單打紀錄')">單打紀錄</button>
        <button class="tab-btn" data-s="雙打紀錄" onclick="setTeacherSheet('雙打紀錄')">雙打紀錄</button>
        <button class="tab-btn" data-s="學生分組表" onclick="setTeacherSheet('學生分組表')">學生名單</button>
        <button class="tab-btn" data-s="團體賽紀錄" onclick="setTeacherSheet('團體賽紀錄')">團體賽</button>
        <button class="tab-btn" data-s="__group__" onclick="setTeacherSheet('__group__')">🧩 分組配對</button>
      </div>
      <div id="tListBox">
      <input type="text" id="tSearch" placeholder="搜尋（班級、姓名、學號…）" oninput="renderTeacherList()" style="margin-top:10px;">
      <div class="header-bar" style="margin:10px 0;">
        <span id="tCount" class="sub-info"></span>
        <div class="btn-group-sm">
          <button class="rebind-btn" onclick="loadTeacherData()">↻ 重新整理</button>
          <button class="rebind-btn" style="background:#06C755; color:#fff;" onclick="openRowEditor(null)">➕ 新增</button>
        </div>
      </div>
      <div id="tList"></div></div>
      <div id="groupBox" style="display:none; margin-top:10px;">
        <span class="section-label">1. 選擇班級</span>
        <select id="gClass" class="sel" onchange="loadGroupStudents()"></select>
        <span class="section-label">2. 選擇賽制</span>
        <div class="tabs" id="modeTabs">
          <button type="button" class="tab-btn" data-m="single" onclick="setGroupMode('single')">單打</button>
          <button type="button" class="tab-btn" data-m="double" onclick="setGroupMode('double')">雙打（2人一隊）</button>
          <button type="button" class="tab-btn" data-m="team" onclick="setGroupMode('team')">團體賽</button>
        </div>
        <div id="gTeamSizeBox" style="display:none;">
          <span class="section-label">每隊人數（2～4 人）</span>
          <select id="gTeamSize" class="sel" onchange="renderGroupPreview()">
            <option value="2">2 人一隊</option><option value="3">3 人一隊</option><option value="4">4 人一隊</option>
          </select>
        </div>
        <span class="section-label">3. 組別編號</span>
        <input type="text" id="gPool" placeholder="例：1">
        <div class="header-bar" style="margin-top:12px;">
          <span class="section-label" style="margin:0;">4. 依序點選學生（已選 <span id="gSelCount">0</span> 人）</span>
          <div class="btn-group-sm">
            <button type="button" class="rebind-btn" onclick="selectAllStudents(true)">全選</button>
            <button type="button" class="rebind-btn" onclick="selectAllStudents(false)">清除</button>
          </div>
        </div>
        <div class="sub-info" style="margin:4px 0 8px;">雙打／團體賽會依點選順序，每 2～4 人自動組成一隊。</div>
        <div id="gStudents"></div>
        <div id="gPreview"></div>
        <button class="btn" id="gCreateBtn" onclick="createMatches()">產生對戰（循環賽）</button>
      </div>
      <button class="btn btn-dark" onclick="closeLiffWindow()">🔙 關閉視窗回到 LINE BOT</button>
    </div>
  </div>

  <!-- 資料編輯視窗 -->
  <div id="rowModal" class="modal-overlay">
    <div class="modal-box">
      <h3 id="rowModalTitle" style="margin-bottom:10px;"></h3>
      <div id="rowFields"></div>
      <button class="btn" id="rowSaveBtn" onclick="saveRow()">儲存</button>
      <button class="btn btn-cancel" onclick="closeRowModal()">取消</button>
    </div>
  </div>

  <!-- 3. 勾選式對戰成績表單彈窗 -->
  <div id="scoreModal" class="modal-overlay">
    <div class="modal-box">
      <h3 style="margin-bottom:4px;">✅ 勾選比賽結果</h3>
      <div id="modalSubTitle" style="font-size:12px; color:#666; margin-bottom:10px;"></div>

      <span class="section-label">1. 請勾選本場獲勝方：</span>
      <div class="check-group">
        <label class="check-option">
          <input type="radio" name="winnerSide" value="A" checked onchange="syncPresetScores()">
          <div class="check-card"><span class="check-icon">☑</span><span id="labelSideA">A方</span></div>
        </label>
        <label class="check-option">
          <input type="radio" name="winnerSide" value="B" onchange="syncPresetScores()">
          <div class="check-card"><span class="check-icon">☑</span><span id="labelSideB">B方</span></div>
        </label>
      </div>

      <span class="section-label">2. 請勾選總局數比：</span>
      <div class="check-group">
        <label class="check-option" style="min-width:30%;">
          <input type="radio" name="gameRatio" value="2:0" checked onchange="toggleSet3(false); syncPresetScores();">
          <div class="check-card">2 : 0 (直落二)</div>
        </label>
        <label class="check-option" style="min-width:30%;">
          <input type="radio" name="gameRatio" value="2:1" onchange="toggleSet3(true); syncPresetScores();">
          <div class="check-card">2 : 1 (打滿三局)</div>
        </label>
        <label class="check-option" style="min-width:30%;">
          <input type="radio" name="gameRatio" value="1:0" onchange="toggleSet3(false); syncPresetScores();">
          <div class="check-card">1 : 0 (單局制)</div>
        </label>
      </div>

      <span class="section-label">3. 各局得分（可點選快捷比分或 +/- 微調）：</span>

      <div class="set-box" id="boxSet1">
        <div class="set-header">
          <span>第 1 局</span>
          <div class="preset-chips">
            <button type="button" class="chip" onclick="applyQuickScore(1, 21, 15)">21:15</button>
            <button type="button" class="chip" onclick="applyQuickScore(1, 11, 7)">11:7</button>
          </div>
        </div>
        <div class="stepper-row">
          <div class="stepper"><button type="button" onclick="stepScore('s1_a', -1)">-</button><span id="s1_a">21</span><button type="button" onclick="stepScore('s1_a', 1)">+</button></div>
          <strong>:</strong>
          <div class="stepper"><button type="button" onclick="stepScore('s1_b', -1)">-</button><span id="s1_b">15</span><button type="button" onclick="stepScore('s1_b', 1)">+</button></div>
        </div>
      </div>

      <div class="set-box" id="boxSet2">
        <div class="set-header">
          <span>第 2 局</span>
          <div class="preset-chips">
            <button type="button" class="chip" onclick="applyQuickScore(2, 21, 15)">21:15</button>
            <button type="button" class="chip" onclick="applyQuickScore(2, 11, 7)">11:7</button>
          </div>
        </div>
        <div class="stepper-row">
          <div class="stepper"><button type="button" onclick="stepScore('s2_a', -1)">-</button><span id="s2_a">21</span><button type="button" onclick="stepScore('s2_a', 1)">+</button></div>
          <strong>:</strong>
          <div class="stepper"><button type="button" onclick="stepScore('s2_b', -1)">-</button><span id="s2_b">15</span><button type="button" onclick="stepScore('s2_b', 1)">+</button></div>
        </div>
      </div>

      <div class="set-box" id="boxSet3" style="display:none;">
        <div class="set-header">
          <span>第 3 局 (決勝局)</span>
          <div class="preset-chips">
            <button type="button" class="chip" onclick="applyQuickScore(3, 21, 18)">21:18</button>
            <button type="button" class="chip" onclick="applyQuickScore(3, 11, 9)">11:9</button>
          </div>
        </div>
        <div class="stepper-row">
          <div class="stepper"><button type="button" onclick="stepScore('s3_a', -1)">-</button><span id="s3_a">21</span><button type="button" onclick="stepScore('s3_a', 1)">+</button></div>
          <strong>:</strong>
          <div class="stepper"><button type="button" onclick="stepScore('s3_b', -1)">-</button><span id="s3_b">18</span><button type="button" onclick="stepScore('s3_b', 1)">+</button></div>
        </div>
      </div>

      <label style="display:flex; align-items:center; gap:8px; margin-top:12px; font-size:13px; cursor:pointer;">
        <input type="checkbox" id="confirmCheck" checked style="width:18px; height:18px; accent-color:#06C755;">
        <span>我已確認雙方比分無誤（送出後將鎖定為 GAME=yes）</span>
      </label>

      <button class="btn" id="saveScoreBtn" onclick="submitScore()">確認送出成績</button>
      <button class="btn btn-cancel" onclick="closeModal()">取消返回</button>
    </div>
  </div>

  <script>
    // ===== 請在此填入您的設定值 =====
    // 注意：LIFF ID 只填 "數字-英數字"，不要包含 https://liff.line.me/
    const MY_LIFF_ID = "2012562883-jBwg6hLv";
    // 您的 LINE 官方帳號 Basic ID（含 @），例如 "@123abcde"
    const MY_BOT_BASIC_ID = "@241jqyyw";
    // GAS 網頁應用程式部署網址（結尾是 /exec）
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxyEwGdX6vusSc12pR3p8jqoEpTuqrD51xthxpLBjACTmHwSLL_ROAuQAsZLyo6ny3DMQ/exec";
    // ================================

    let liffReady = false;       // LIFF 是否初始化成功
    let liffInitError = "";
    let currentLineUserId = "";
    let currentStudent = null;
    let currentMatches = [];
    let selectedMatch = null;

    // ---- 呼叫 GAS API（以 LINE access token 驗證身分）----
    function callApi(action, data) {
      const token = liffReady ? liff.getAccessToken() : null;
      if (!token) return Promise.reject(new Error("尚未取得 LINE 登入資訊"));
      return fetch(GAS_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },  // 避免 CORS 預檢請求
        body: JSON.stringify({ action: action, accessToken: token, data: data || {} }),
        redirect: "follow"
      })
      .then(r => r.text())
      .then(text => {
        let j;
        try { j = JSON.parse(text); }
        catch (e) { throw new Error("後端回傳非 JSON：" + text.slice(0, 150)); }
        if (!j.ok) throw new Error(j.error || ("後端回應：" + text.slice(0, 150)));
        return j.data;
      });
    }

    function showFatal(msg) {
      document.getElementById("loadingBox").innerHTML =
        '<div style="color:#d32f2f; font-size:14px; margin-bottom:12px;">' + msg + '</div>' +
        '<button class="btn btn-dark" onclick="closeLiffWindow()">關閉視窗</button>';
    }

    function logStep(msg) {
      const el = document.getElementById("loadingText");
      if (el) el.innerHTML += "<br><span style='font-size:12px; color:#666;'>" + msg + "</span>";
    }

    window.onerror = function(message, source, lineno) {
      logStep("<strong style='color:red;'>程式錯誤 (第" + lineno + "行): " + message + "</strong>");
    };

    document.addEventListener("DOMContentLoaded", function() {
      logStep("1. 網頁載入完成 (版本 v5)，初始化 LIFF...");
      if (typeof liff === 'undefined') {
        showFatal("無法載入 LINE LIFF SDK，請檢查網路。");
        return;
      }
      liff.init({ liffId: MY_LIFF_ID }).then(() => {
        liffReady = true;
        if (!liff.isLoggedIn()) { liff.login(); return; }
        logStep("2. LIFF 初始化成功，查詢賽程中...");
        loadDashboard(true);
      }).catch(err => {
        liffInitError = err.message;
        showFatal("LIFF 初始化失敗：" + err.message);
      });
    });

    // ===== 關閉視窗（已修正）=====
    function closeLiffWindow() {
      // 1. LIFF 正常且在 LINE App 內 → 直接關閉
      try {
        if (liffReady && liff.isInClient()) {
          liff.closeWindow();
          return;
        }
      } catch (e) {
        console.log("closeWindow error:", e);
      }

      // 2. 備援：開啟官方帳號聊天室（@ 需編碼為 %40）
      if (MY_BOT_BASIC_ID && MY_BOT_BASIC_ID !== "@your_bot_id") {
        const url = "https://line.me/R/ti/p/" + encodeURIComponent(MY_BOT_BASIC_ID);
        try {
          const w = window.open(url, "_top");
          if (!w) window.location.href = url;
        } catch (e) {
          window.location.href = url;
        }
        return;
      }

      // 3. 都不行 → 提示手動返回
      alert("無法自動關閉" + (liffInitError ? "（" + liffInitError + "）" : "（請用 LINE 內的 LIFF 連結開啟）") + "。\n請手動點選左上角「✕」回到 LINE。");
    }

    function showBindScreen(hintText) {
      document.getElementById("loadingBox").style.display = "none";
      document.getElementById("dashboardBox").style.display = "none";
      document.getElementById("teacherBox").style.display = "none";
      document.getElementById("bindBox").style.display = "block";
      if (hintText) {
        const errEl = document.getElementById("bindErr");
        errEl.style.display = "block";
        errEl.innerText = hintText;
      }
    }

    function loadDashboard(showFullLoading = true) {
      if (showFullLoading) {
        document.getElementById("loadingBox").style.display = "block";
        document.getElementById("teacherBox").style.display = "none";
        document.getElementById("bindBox").style.display = "none";
        document.getElementById("dashboardBox").style.display = "none";
      }
      callApi("getUserDashboard").then(res => {
        document.getElementById("loadingBox").style.display = "none";
        if (!res || !res.isBound) {
          showBindScreen("");
        } else {
          if (res.role === "teacher") { showTeacher(res.teacher); return; }
          currentStudent = res.student;
          currentMatches = res.matches || [];
          renderDashboard(currentStudent, currentMatches);
        }
      }).catch(err => {
        showBindScreen("後端讀取失敗：" + err.message);
      });
    }

    function doBind() {
      const sid = document.getElementById("inputStudentId").value.trim();
      if (!sid) { alert("請輸入學號！"); return; }
      const btn = document.getElementById("bindBtn");
      btn.disabled = true; btn.innerText = "綁定中...";

      callApi("bindStudentAccount", { studentId: sid }).then(res => {
        btn.disabled = false; btn.innerText = "確認綁定學號";
        if (!res.success) {
          alert(res.message);
        } else {
          document.getElementById("bindErr").style.display = "none";
          loadDashboard(true);
        }
      }).catch(err => {
        btn.disabled = false; btn.innerText = "確認綁定學號";
        alert("綁定發生錯誤：" + err.message);
      });
    }

    function showRebind() {
      showBindScreen("");
    }

    // ===== 解除綁定（學生／老師共用）=====
    function doUnbind() {
      if (!confirm("確定要解除此 LINE 帳號的綁定嗎？")) return;
      callApi("unbind").then(() => {
        alert("已解除綁定。");
        currentStudent = null; currentMatches = [];
        showBindScreen("");
      }).catch(err => alert("解除綁定失敗：" + err.message));
    }

    // ===== 老師綁定 =====
    function toggleTeacherBind(ev) {
      ev.preventDefault();
      const b = document.getElementById("teacherBindBox");
      b.style.display = (b.style.display === "none") ? "block" : "none";
    }

    function doBindTeacher() {
      const name = document.getElementById("inputTeacherName").value.trim();
      const code = document.getElementById("inputTeacherCode").value.trim();
      if (!name || !code) { alert("請輸入老師姓名與教師驗證碼！"); return; }
      const btn = document.getElementById("teacherBindBtn");
      btn.disabled = true; btn.innerText = "綁定中...";
      callApi("bindTeacher", { name: name, code: code }).then(res => {
        alert(res.message);
        document.getElementById("inputTeacherCode").value = "";
        loadDashboard(true);
      }).catch(err => alert("老師綁定失敗：" + err.message))
        .finally(() => { btn.disabled = false; btn.innerText = "綁定為老師"; });
    }

    // ===== 老師：分組配對（單打／雙打／團體賽）=====
    let gStudents = [], gSel = [], gMode = "single", gInited = false;

    function initGroupPanel() {
      setGroupMode(gMode);
      if (gInited) return;
      callApi("teacherRoster", { peclass: "" }).then(res => {
        document.getElementById("gClass").innerHTML = (res.classes || [])
          .map(c => '<option value="' + esc(c) + '">' + esc(c) + '</option>').join("");
        gInited = true;
        loadGroupStudents();
      }).catch(err => alert("讀取班級失敗：" + err.message));
    }

    function loadGroupStudents() {
      const cls = document.getElementById("gClass").value;
      if (!cls) return;
      document.getElementById("gStudents").innerText = "讀取中...";
      callApi("teacherRoster", { peclass: cls }).then(res => {
        gStudents = res.students || [];
        gSel = [];
        renderGroupStudents();
      }).catch(err => { document.getElementById("gStudents").innerText = "讀取失敗：" + err.message; });
    }

    function setGroupMode(m) {
      gMode = m;
      document.querySelectorAll("#modeTabs .tab-btn").forEach(b => b.classList.toggle("active", b.dataset.m === m));
      document.getElementById("gTeamSizeBox").style.display = (m === "team") ? "block" : "none";
      renderGroupPreview();
    }

    function toggleStudent(id) {
      const i = gSel.indexOf(id);
      if (i >= 0) gSel.splice(i, 1); else gSel.push(id);
      renderGroupStudents();
    }

    function selectAllStudents(all) {
      gSel = all ? gStudents.map(s => s.id) : [];
      renderGroupStudents();
    }

    function renderGroupStudents() {
      const box = document.getElementById("gStudents");
      box.innerHTML = "";
      if (!gStudents.length) { box.innerText = "此班級沒有學生資料。"; }
      const grid = document.createElement("div");
      grid.className = "stu-grid";
      gStudents.forEach(s => {
        const order = gSel.indexOf(s.id) + 1;
        const b = document.createElement("button");
        b.type = "button";
        b.className = "stu" + (order ? " on" : "");
        b.innerText = (order ? order + ". " : "") + s.name;
        b.onclick = () => toggleStudent(s.id);
        grid.appendChild(b);
      });
      box.appendChild(grid);
      document.getElementById("gSelCount").innerText = gSel.length;
      renderGroupPreview();
    }

    // 依點選順序切成每組 size 人
    function buildGroups() {
      const size = gMode === "single" ? 1 : gMode === "double" ? 2 : Number(document.getElementById("gTeamSize").value);
      if (size > 1 && gSel.length % size !== 0) {
        return { error: "已選 " + gSel.length + " 人，無法平均分成每隊 " + size + " 人（人數需為 " + size + " 的倍數）。" };
      }
      const groups = [];
      for (let i = 0; i < gSel.length; i += size) groups.push(gSel.slice(i, i + size));
      if (groups.length < 2) return { error: "至少需要 2 " + (size === 1 ? "位選手" : "隊") + " 才能配對。" };
      return { groups: groups };
    }

    function renderGroupPreview() {
      const el = document.getElementById("gPreview");
      if (!gSel.length) { el.innerHTML = ""; return; }
      const r = buildGroups();
      if (r.error) { el.innerHTML = '<div class="err-msg" style="display:block;">' + esc(r.error) + '</div>'; return; }
      const nm = id => (gStudents.find(s => s.id === id) || {}).name || id;
      const n = r.groups.length;
      let html = "";
      if (gMode !== "single") {
        html += r.groups.map((g, i) => '<div class="sub-info">隊伍 ' + (i + 1) + '：' + esc(g.map(nm).join(" & ")) + '</div>').join("");
      }
      html += '<div style="font-size:13px; font-weight:bold; margin-top:6px;">共 ' + n + (gMode === "single" ? " 位選手" : " 隊") +
              '，將產生 ' + (n * (n - 1) / 2) + ' 場對戰（循環賽）</div>';
      el.innerHTML = '<div class="set-box" style="margin-top:10px;">' + html + '</div>';
    }

    function createMatches() {
      const cls = document.getElementById("gClass").value;
      const pool = document.getElementById("gPool").value.trim();
      if (!cls) { alert("請選擇班級！"); return; }
      if (!pool) { alert("請輸入組別編號！"); return; }
      const r = buildGroups();
      if (r.error) { alert(r.error); return; }
      const label = { single: "單打", double: "雙打", team: "團體賽" }[gMode];
      const n = r.groups.length;
      if (!confirm("確定建立【" + cls + "】第 " + pool + " 組的" + label + "對戰嗎？\n共 " + n + " 組，將產生 " + (n * (n - 1) / 2) + " 場（已存在的對戰會自動略過）。")) return;

      const btn = document.getElementById("gCreateBtn");
      btn.disabled = true; btn.innerText = "建立中...";
      callApi("teacherCreateMatches", { mode: gMode, peclass: cls, pool: pool, groups: r.groups }).then(res => {
        alert(res.message);
        gSel = [];
        renderGroupStudents();
      }).catch(err => alert("建立失敗：" + err.message))
        .finally(() => { btn.disabled = false; btn.innerText = "產生對戰（循環賽）"; });
    }

    // ===== 老師：資料維護（新增／修改／刪除）=====
    let tSheet = "單打紀錄", tHeaders = [], tRows = [], tEditRow = null;

    function esc(s) {
      return String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    }

    function showTeacher(t) {
      ["loadingBox", "bindBox", "dashboardBox"].forEach(id => document.getElementById(id).style.display = "none");
      document.getElementById("teacherBox").style.display = "block";
      document.getElementById("teacherTitle").innerText = "👩‍🏫 " + t.name + " 老師";
      loadTeacherData();
    }

    function setTeacherSheet(name) {
      tSheet = name;
      document.getElementById("tSearch").value = "";
      loadTeacherData();
    }

    function loadTeacherData() {
      document.querySelectorAll("#mainTabs .tab-btn").forEach(b => b.classList.toggle("active", b.dataset.s === tSheet));
      const isGroup = (tSheet === "__group__");
      document.getElementById("tListBox").style.display = isGroup ? "none" : "block";
      document.getElementById("groupBox").style.display = isGroup ? "block" : "none";
      if (isGroup) { initGroupPanel(); return; }
      document.getElementById("tList").innerHTML = '<div class="sub-info" style="padding:16px; text-align:center;">讀取中...</div>';
      callApi("teacherList", { sheet: tSheet }).then(res => {
        tHeaders = res.headers || [];
        tRows = res.rows || [];
        renderTeacherList();
      }).catch(err => {
        document.getElementById("tList").innerText = "讀取失敗：" + err.message;
      });
    }

    function renderTeacherList() {
      const kw = document.getElementById("tSearch").value.trim().toLowerCase();
      const list = document.getElementById("tList");
      list.innerHTML = "";
      const rows = tRows.filter(r => !kw || r.cells.join(" ").toLowerCase().includes(kw));
      document.getElementById("tCount").innerText = "共 " + rows.length + " 筆" + (rows.length > 50 ? "（只顯示前 50 筆，請用搜尋縮小範圍）" : "");
      rows.slice(0, 50).forEach(r => {
        const txt = r.cells.filter(c => String(c).trim() !== "").slice(0, 10).join(" ｜ ");
        const div = document.createElement("div");
        div.className = "match-item";
        div.innerHTML =
          '<div class="sub-info" style="word-break:break-all;">第 ' + r.rowIndex + ' 列：' + esc(txt) + '</div>' +
          '<div style="display:flex; gap:8px; margin-top:8px;">' +
          '<button class="rebind-btn" onclick="openRowEditor(' + r.rowIndex + ')">✏️ 修改</button>' +
          '<button class="rebind-btn" style="color:#d32f2f;" onclick="deleteRow(' + r.rowIndex + ')">🗑 刪除</button></div>';
        list.appendChild(div);
      });
    }

    function openRowEditor(rowIndex) {
      tEditRow = rowIndex || null;
      const row = rowIndex ? tRows.find(r => r.rowIndex === rowIndex) : null;
      document.getElementById("rowModalTitle").innerText = rowIndex ? "✏️ 修改 " + tSheet + " 第 " + rowIndex + " 列" : "➕ 新增資料（" + tSheet + "）";
      const box = document.getElementById("rowFields");
      box.innerHTML = "";
      tHeaders.forEach((h, i) => {
        const wrap = document.createElement("div");
        wrap.style.marginBottom = "8px";
        wrap.innerHTML = '<span class="section-label" style="margin:0 0 3px;">' + esc(h || ("欄位" + (i + 1))) + '</span>' +
          '<input type="text" data-i="' + i + '" value="' + esc(row ? row.cells[i] : "") + '">';
        box.appendChild(wrap);
      });
      document.getElementById("rowModal").style.display = "flex";
    }

    function closeRowModal() {
      document.getElementById("rowModal").style.display = "none";
      tEditRow = null;
    }

    function saveRow() {
      const cells = Array.from(document.querySelectorAll("#rowFields input")).map(i => i.value);
      const btn = document.getElementById("rowSaveBtn");
      btn.disabled = true; btn.innerText = "儲存中...";
      callApi("teacherSave", { sheet: tSheet, rowIndex: tEditRow, cells: cells }).then(res => {
        alert(res.message);
        closeRowModal();
        loadTeacherData();
      }).catch(err => alert("儲存失敗：" + err.message))
        .finally(() => { btn.disabled = false; btn.innerText = "儲存"; });
    }

    function deleteRow(rowIndex) {
      if (!confirm("確定要刪除「" + tSheet + "」第 " + rowIndex + " 列嗎？\n此動作無法復原。")) return;
      callApi("teacherDelete", { sheet: tSheet, rowIndex: rowIndex }).then(res => {
        alert(res.message);
        loadTeacherData();
      }).catch(err => alert("刪除失敗：" + err.message));
    }

    function renderDashboard(student, matches) {
      document.getElementById("bindBox").style.display = "none";
      document.getElementById("dashboardBox").style.display = "block";
      document.getElementById("studentTitle").innerText = `${student.name} (${student.studentId})`;
      document.getElementById("studentSub").innerText = `體育班級：${student.peclass}`;

      const listEl = document.getElementById("matchList");
      listEl.innerHTML = "";

      if (!matches || matches.length === 0) {
        listEl.innerHTML = '<div style="text-align:center; color:#888; padding:20px;">目前尚未安排任何賽程。</div>';
        return;
      }

      matches.forEach(m => {
        const isDone = m.gameStatus === 'yes';
        const div = document.createElement("div");
        div.className = `match-item ${isDone ? 'done' : 'pending'}`;
        div.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <span class="sub-info">【${m.typeLabel}】${m.peclass} - 第 ${m.pool} 組 (#${m.matchNo})</span>
            <span class="badge ${isDone ? 'badge-yes' : 'badge-no'}">
              ${isDone ? '✅ 已有資料 (GAME=yes)' : '⏳ 需輸入成績 (GAME=no)'}
            </span>
          </div>
          <div class="vs-title">${m.sideA.name}  VS  ${m.sideB.name}</div>
          <div class="sub-info">
            ${isDone
              ? `總分：<strong>${m.scoreA} : ${m.scoreB}</strong> ｜ 勝方：<strong>${m.winName}</strong>`
              : `<span style="color:#ef6c00;">👉 點擊此卡片勾選對戰結果</span>`}
          </div>
        `;
        if (!isDone) div.onclick = () => openScoreModal(m);
        listEl.appendChild(div);
      });
    }

    function openScoreModal(match) {
      selectedMatch = match;
      document.getElementById("modalSubTitle").innerText = `【${match.typeLabel}】${match.peclass} 第 ${match.pool} 組`;
      document.getElementById("labelSideA").innerText = match.sideA.name;
      document.getElementById("labelSideB").innerText = match.sideB.name;

      document.querySelector('input[name="winnerSide"][value="A"]').checked = true;
      document.querySelector('input[name="gameRatio"][value="2:0"]').checked = true;
      document.getElementById("confirmCheck").checked = true;
      toggleSet3(false);
      syncPresetScores();
      document.getElementById("scoreModal").style.display = "flex";
    }

    function toggleSet3(show) {
      document.getElementById("boxSet3").style.display = show ? "block" : "none";
      const ratio = document.querySelector('input[name="gameRatio"]:checked').value;
      document.getElementById("boxSet2").style.display = (ratio === "1:0") ? "none" : "block";
    }

    function syncPresetScores() {
      const winner = document.querySelector('input[name="winnerSide"]:checked').value;
      const ratio = document.querySelector('input[name="gameRatio"]:checked').value;
      const winPts = 21, losePts = 15;

      if (winner === 'A') {
        setVal('s1_a', winPts); setVal('s1_b', losePts);
        if (ratio === '2:1') {
          setVal('s2_a', losePts); setVal('s2_b', winPts);
          setVal('s3_a', winPts); setVal('s3_b', 18);
        } else {
          setVal('s2_a', winPts); setVal('s2_b', losePts);
        }
      } else {
        setVal('s1_a', losePts); setVal('s1_b', winPts);
        if (ratio === '2:1') {
          setVal('s2_a', winPts); setVal('s2_b', losePts);
          setVal('s3_a', 18); setVal('s3_b', winPts);
        } else {
          setVal('s2_a', losePts); setVal('s2_b', winPts);
        }
      }
    }

    function applyQuickScore(setNum, winScore, loseScore) {
      const winner = document.querySelector('input[name="winnerSide"]:checked').value;
      setVal(`s${setNum}_a`, winner === 'A' ? winScore : loseScore);
      setVal(`s${setNum}_b`, winner === 'B' ? winScore : loseScore);
    }

    function stepScore(elId, delta) {
      const el = document.getElementById(elId);
      el.innerText = Math.max(0, Number(el.innerText) + delta);
    }

    function setVal(id, val) { document.getElementById(id).innerText = val; }
    function getVal(id) { return Number(document.getElementById(id).innerText); }

    function closeModal() {
      document.getElementById("scoreModal").style.display = "none";
      selectedMatch = null;
    }

    function submitScore() {
      if (!selectedMatch) return;
      if (!document.getElementById("confirmCheck").checked) {
        alert("請先勾選「我已確認雙方比分無誤」！");
        return;
      }

      const matchCopy = Object.assign({}, selectedMatch);
      const ratio = document.querySelector('input[name="gameRatio"]:checked').value;
      const scores = [{ a: getVal('s1_a'), b: getVal('s1_b') }];
      if (ratio !== '1:0') scores.push({ a: getVal('s2_a'), b: getVal('s2_b') });
      if (ratio === '2:1') scores.push({ a: getVal('s3_a'), b: getVal('s3_b') });

      const totalA = scores.reduce((sum, s) => sum + s.a, 0);
      const totalB = scores.reduce((sum, s) => sum + s.b, 0);

      const btn = document.getElementById("saveScoreBtn");
      btn.disabled = true; btn.innerText = "寫入中...";

      const payload = {
        matchType: matchCopy.matchType,
        rowIndex: matchCopy.rowIndex,
        sideA: matchCopy.sideA,
        sideB: matchCopy.sideB,
        scores: scores
      };

      callApi("updateMatchResult", { payload: payload }).then(function(res) {
        btn.disabled = false; btn.innerText = "確認送出成績";
        closeModal();

        const target = currentMatches.find(m => m.matchType === matchCopy.matchType && m.rowIndex === matchCopy.rowIndex);
        if (target) {
          target.gameStatus = 'yes';
          target.scoreA = totalA;
          target.scoreB = totalB;
          target.winName = res.winner;
          renderDashboard(currentStudent, currentMatches);
        }

        const msgText = `✅ 賽程成績登錄完成！\n項目：${matchCopy.typeLabel} (第 ${matchCopy.pool} 組)\n對戰：${matchCopy.sideA.name} vs ${matchCopy.sideB.name}\n總分：${res.scoreText}\n勝方：${res.winner}`;

        const finish = function() {
          alert(`登記成功！勝方：${res.winner}`);
          closeLiffWindow();
        };

        // sendMessages 只有在 LINE App 內開啟才有效
        let canSend = false;
        try { canSend = liffReady && liff.isInClient(); } catch (e) {}

        if (canSend) {
          liff.sendMessages([{ type: 'text', text: msgText }])
            .then(finish)
            .catch(function(e) {
              console.log("sendMessages error:", e);
              finish();
            });
        } else {
          finish();
        }
      }).catch(function(err) {
        btn.disabled = false; btn.innerText = "確認送出成績";
        alert("寫入錯誤：" + err.message);
      });
    }
  </script>
</body>
</html>
